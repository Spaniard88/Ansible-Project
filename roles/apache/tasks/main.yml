- name: Install Apache
  ansible.builtin.dnf:
    name: "{{ apache_package }}"
    state: present

- name: Deploy website
  ansible.builtin.copy:
    src: "{{ website_file }}"
    dest: "{{ website_destination }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Apache

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: "{{ apache_service }}"
    state: started
    enabled: true

- name: Ensure firewalld is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: Ensure firewalld is enabled and running
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: Allow web traffic through firewall
  ansible.posix.firewalld:
    service: "{{ firewall_service }}"
    permanent: true
    state: enabled
    immediate: true
